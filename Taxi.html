<!DOCTYPE html>
<html>
<head>
    <title>Royal Taxi - Ride App</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body.app-mode {
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        #map { 
            height: 100%; 
            width: 100%; 
            background: #1a1a2e;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* DESKTOP VIEW - 70-30 Split */
        @media (min-width: 651px) {
            .left-container {
                position: absolute;
                top: 0;
                left: 0;
                width: 70%;
                height: 100%;
                z-index: 1000;
                pointer-events: none;
            }
            
            .left-container > * {
                pointer-events: auto;
            }
            
            .role-selector {
                position: absolute;
                top: 12px;
                left: 12px;
                right: 12px;
                width: auto;
                display: flex;
                gap: 10px;
            }
            
            .role-btn {
                flex: 1;
                padding: 10px 0;
                font-size: 14px;
                background: rgba(0,0,0,0.75);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255,215,0,0.3);
                color: white;
                border-radius: 40px;
                font-weight: 700;
                cursor: pointer;
                text-align: center;
                transition: all 0.3s ease;
            }
            
            .role-btn:hover {
                transform: scale(1.02);
            }
            
            .role-btn.active {
                background: linear-gradient(135deg, #c9a03d, #8b6914);
                border: 1px solid rgba(255,215,0,0.8);
                box-shadow: 0 4px 20px rgba(201,160,61,0.4);
            }
            
            .search-container {
                position: absolute;
                top: 72px;
                left: 12px;
                right: 12px;
                display: flex;
                gap: 10px;
                align-items: center;
            }
            
            .search-box {
                flex: 1;
                background: rgba(0,0,0,0.75);
                backdrop-filter: blur(20px);
                border-radius: 50px;
                display: flex;
                align-items: center;
                padding: 0 12px;
                border: 1px solid rgba(255,215,0,0.3);
                transition: border-color 0.3s ease;
            }
            
            .search-box:focus-within {
                border-color: #c9a03d;
                box-shadow: 0 0 20px rgba(201,160,61,0.1);
            }
            
            .search-box input {
                flex: 1;
                padding: 10px 6px;
                border: none;
                background: transparent;
                font-size: 13px;
                outline: none;
                color: white;
            }
            
            .search-box input::placeholder {
                color: rgba(255,255,255,0.4);
            }
            
            .search-box button {
                background: linear-gradient(135deg, #c9a03d, #8b6914);
                border: none;
                color: white;
                padding: 5px 12px;
                border-radius: 40px;
                cursor: pointer;
                font-size: 11px;
                font-weight: 700;
                white-space: nowrap;
                transition: transform 0.2s ease;
            }
            
            .search-box button:hover {
                transform: scale(1.05);
            }
            
            .my-location-btn {
                width: 40px;
                min-width: 40px;
                height: 40px;
                background: rgba(0,0,0,0.75);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255,215,0,0.3);
                border-radius: 50%;
                cursor: pointer;
                font-size: 16px;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
            }
            
            .my-location-btn:hover {
                transform: scale(1.05);
                border-color: #c9a03d;
            }
            
            .pickup-mode-row {
                position: absolute;
                top: 128px;
                left: 12px;
                right: 12px;
                display: flex;
                gap: 10px;
                align-items: center;
                flex-wrap: wrap;
            }
            
            .pickup-mode-selector {
                display: flex;
                gap: 10px;
                flex: 1;
                flex-wrap: wrap;
            }
            
            .mode-btn {
                background: rgba(0,0,0,0.75);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255,215,0,0.3);
                color: white;
                padding: 6px 16px;
                border-radius: 40px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 5px;
                transition: all 0.3s ease;
            }
            
            .mode-btn:hover {
                transform: scale(1.02);
            }
            
            .mode-btn.active {
                background: linear-gradient(135deg, #c9a03d, #8b6914);
                border-color: rgba(255,215,0,0.8);
                box-shadow: 0 2px 15px rgba(201,160,61,0.2);
            }
            
            .clear-location-btn {
                background: rgba(0,0,0,0.7);
                backdrop-filter: blur(16px);
                border: 1px solid rgba(255,215,0,0.2);
                color: white;
                padding: 6px 14px;
                border-radius: 40px;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 5px;
                flex-shrink: 0;
                white-space: nowrap;
                transition: all 0.3s ease;
            }
            
            .clear-location-btn:hover {
                border-color: #dc3545;
                color: #dc3545;
            }
            
            .right-container {
                position: absolute;
                top: 0;
                right: 0;
                width: 30%;
                height: 100%;
                background: rgba(0,0,0,0.85);
                backdrop-filter: blur(20px);
                z-index: 999;
                display: flex;
                flex-direction: column;
                border-left: 1px solid rgba(255,215,0,0.2);
                pointer-events: auto;
                overflow: hidden;
            }
            
            .vehicles-vertical {
                flex: 1;
                overflow-y: auto;
                padding: 10px 12px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                height: auto;
                padding-bottom: 0;
            }
            
            .vehicles-vertical::-webkit-scrollbar {
                width: 5px;
            }
            
            .vehicles-vertical::-webkit-scrollbar-track {
                background: rgba(255,255,255,0.05);
                border-radius: 10px;
            }
            
            .vehicles-vertical::-webkit-scrollbar-thumb {
                background: #c9a03d;
                border-radius: 10px;
            }
            
            .vehicle-btn-vertical {
                background: rgba(255,255,255,0.08);
                border: 1px solid rgba(255,255,255,0.1);
                color: white;
                padding: 12px 14px;
                border-radius: 12px;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                pointer-events: auto;
                flex-shrink: 0;
                min-height: 52px;
            }
            
            .vehicle-btn-vertical:last-child {
                margin-bottom: 0;
            }
            
            .vehicle-btn-vertical:hover {
                background: rgba(255,255,255,0.15);
                transform: scale(1.01);
            }
            
            .vehicle-btn-vertical.active {
                background: linear-gradient(135deg, #c9a03d, #8b6914);
                border-color: #c9a03d;
                box-shadow: 0 0 15px rgba(201,160,61,0.3);
            }
            
            .vehicle-btn-vertical.women {
                background: rgba(232,62,140,0.2);
                border-color: rgba(232,62,140,0.3);
            }
            
            .vehicle-btn-vertical.women.active {
                background: linear-gradient(135deg, #e83e8c, #c2185b);
                box-shadow: 0 0 15px rgba(232,62,140,0.3);
            }
            
            .vehicle-info-vertical {
                display: flex;
                align-items: center;
                gap: 12px;
                flex: 1;
                pointer-events: none;
            }
            
            .vehicle-icon-vertical {
                font-size: 28px;
                pointer-events: none;
                line-height: 1;
            }
            
            .vehicle-details-vertical {
                display: flex;
                flex-direction: column;
                pointer-events: none;
            }
            
            .vehicle-name-vertical {
                font-weight: 800;
                font-size: 16px;
                pointer-events: none;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                line-height: 1.3;
            }
            
            .vehicle-capacity {
                font-size: 12px;
                color: #ffdd88;
                background: rgba(0,0,0,0.4);
                padding: 2px 8px;
                border-radius: 20px;
                font-weight: 600;
                letter-spacing: 0.5px;
            }
            
            .vehicle-fare-vertical {
                font-weight: 800;
                font-size: 16px;
                color: #c9a03d;
                margin-left: 8px;
                pointer-events: none;
                white-space: nowrap;
            }
            
            .time-badge-vertical {
                font-size: 10px;
                background: rgba(0,0,0,0.5);
                padding: 3px 8px;
                border-radius: 12px;
                margin-left: 8px;
                white-space: nowrap;
                pointer-events: none;
                font-weight: 600;
            }
            
            .info-card {
                margin: 10px 12px 14px 12px;
                padding: 18px 20px;
                background: linear-gradient(135deg, rgba(0,0,0,0.92), rgba(0,0,0,0.85));
                backdrop-filter: blur(24px);
                border-radius: 18px;
                border: 1px solid rgba(201,160,61,0.5);
                color: white;
                text-align: center;
                pointer-events: none;
                flex-shrink: 0;
                width: auto;
                z-index: 10;
                animation: fadeInUp 0.5s ease;
            }
            
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            
            .info-card .live-dot {
                display: inline-block;
                width: 12px;
                height: 12px;
                background: #28a745;
                border-radius: 50%;
                animation: pulse 1.5s infinite;
                margin-right: 6px;
            }
            
            .info-card #speedInfo {
                font-size: 20px !important;
                font-weight: 700 !important;
            }
            
            .info-card #fareInfo {
                font-size: 22px !important;
                font-weight: 800 !important;
                color: #c9a03d;
                transition: all 0.3s ease;
            }
            
            .info-card #routeInfo {
                font-size: 19px !important;
                margin-top: 8px !important;
                line-height: 1.5;
            }
            
            .info-card #routeInfo span {
                font-size: 17px !important;
            }
            
            @keyframes pulse {
                0% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.5; transform: scale(0.8); }
                100% { opacity: 1; transform: scale(1); }
            }
            
            .instruction-toast {
                left: 35%;
                transform: translateX(-50%);
            }
            
            .leaflet-control-zoom {
                left: 12px !important;
                top: 200px !important;
            }
            
            .safety-btn {
                position: absolute;
                bottom: 130px;
                right: calc(30% + 12px);
                background: linear-gradient(135deg, #dc3545, #a71d2a);
                color: white;
                border: none;
                width: 48px;
                height: 48px;
                border-radius: 50%;
                font-size: 22px;
                cursor: pointer;
                z-index: 1001;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 15px rgba(220,53,69,0.3);
                transition: all 0.3s ease;
            }
            
            .safety-btn:hover {
                transform: scale(1.1);
                box-shadow: 0 6px 25px rgba(220,53,69,0.5);
            }
            
            .safety-panel {
                position: absolute;
                bottom: 190px;
                right: calc(30% + 12px);
                background: rgba(0,0,0,0.92);
                backdrop-filter: blur(20px);
                border-radius: 16px;
                padding: 10px;
                z-index: 1001;
                display: none;
                flex-direction: column;
                gap: 6px;
                min-width: 150px;
                border: 1px solid rgba(255,215,0,0.2);
                animation: slideUp 0.3s ease;
            }
            
            @keyframes slideUp {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            
            .safety-panel.active {
                display: flex;
            }
            
            .safety-option {
                background: rgba(255,255,255,0.08);
                border: none;
                color: white;
                padding: 8px 12px;
                border-radius: 30px;
                font-size: 11px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 500;
                transition: all 0.2s ease;
            }
            
            .safety-option:hover {
                transform: scale(1.02);
            }
            
            .safety-option.emergency { background: linear-gradient(135deg, #dc3545, #a71d2a); }
            .safety-option.women { background: linear-gradient(135deg, #e83e8c, #c2185b); }
            
            .driver-panel {
                position: absolute;
                top: 100px;
                left: 12px;
                width: calc(70% - 24px);
                background: rgba(0,0,0,0.9);
                backdrop-filter: blur(20px);
                border-radius: 20px;
                padding: 16px;
                color: white;
                z-index: 1000;
                display: none;
                border: 1px solid rgba(255,215,0,0.2);
                animation: fadeInUp 0.4s ease;
            }
            
            .driver-panel.active {
                display: block;
            }
            
            .search-results {
                position: absolute;
                top: 175px;
                left: 12px;
                width: calc(70% - 24px);
                background: rgba(0,0,0,0.92);
                backdrop-filter: blur(20px);
                border-radius: 16px;
                border: 1px solid rgba(255,215,0,0.2);
                z-index: 1000;
                max-height: 350px;
                overflow-y: auto;
                animation: fadeInUp 0.3s ease;
            }
            
            .search-result-item {
                padding: 10px 16px;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                cursor: pointer;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                transition: background 0.2s ease;
            }
            
            .search-result-item:hover {
                background: rgba(255,255,255,0.05);
            }
            
            .result-name {
                font-weight: 700;
                font-size: 13px;
                color: white !important;
            }
            
            .result-address {
                font-size: 10px;
                color: rgba(255,255,255,0.7) !important;
                margin-top: 2px;
            }
            
            .result-distance {
                font-size: 10px;
                color: #ffdd88 !important;
                font-weight: 600;
                background: rgba(0,0,0,0.4);
                padding: 2px 8px;
                border-radius: 20px;
                white-space: nowrap;
            }
            
            .fab-button {
                display: none;
            }
            
            .bottom-container {
                display: none;
            }
            
            .logout-btn-app {
                background: rgba(0,0,0,0.7);
                backdrop-filter: blur(16px);
                border: 1px solid rgba(255,215,0,0.3);
                color: white;
                padding: 6px 14px;
                border-radius: 40px;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 5px;
                flex-shrink: 0;
                white-space: nowrap;
                transition: all 0.3s ease;
            }
            
            .logout-btn-app:hover {
                border-color: #dc3545;
                color: #dc3545;
            }
            
            .compass {
                display: none;
            }
            
            body > .info-card {
                display: none !important;
            }
        }
        
        /* ========== MOBILE VIEW - FIXED OVERLAPPING ========== */
        @media (max-width: 650px) {
            .left-container, .right-container {
                display: none;
            }
            
            /* Fix: Role selector ko thoda neeche karo */
            .role-selector { 
                position: absolute; 
                top: 8px; 
                left: 8px; 
                right: 8px; 
                z-index: 1000; 
                display: flex; 
                gap: 8px; 
            }
            
            .role-btn { 
                flex: 1; 
                background: rgba(0,0,0,0.85); 
                backdrop-filter: blur(20px); 
                border: 1px solid rgba(255,215,0,0.3);
                color: white; 
                padding: 8px 0; 
                border-radius: 40px; 
                font-size: 12px; 
                font-weight: 700; 
                cursor: pointer; 
                text-align: center;
                transition: all 0.3s ease;
                min-height: 40px;
            }
            
            .role-btn.active { 
                background: linear-gradient(135deg, #c9a03d, #8b6914); 
                border: 1px solid rgba(255,215,0,0.8);
                box-shadow: 0 4px 20px rgba(201,160,61,0.4);
            }
            
            /* Fix: Search container ko neeche shift karo */
            .search-container { 
                position: absolute; 
                top: 58px; 
                left: 8px; 
                right: 8px; 
                z-index: 1000; 
                display: flex; 
                gap: 8px; 
                align-items: center;
            }
            
            .search-box { 
                flex: 1; 
                background: rgba(0,0,0,0.85); 
                backdrop-filter: blur(20px); 
                border-radius: 50px; 
                display: flex; 
                align-items: center; 
                padding: 0 12px; 
                border: 1px solid rgba(255,215,0,0.3);
                min-width: 0;
            }
            
            .search-box input { 
                flex: 1; 
                padding: 10px 4px; 
                border: none; 
                background: transparent; 
                font-size: 13px; 
                outline: none; 
                color: white; 
                font-weight: 500;
                min-width: 0;
            }
            
            .search-box input::placeholder { color: rgba(255,255,255,0.5); font-size: 11px; }
            
            .search-box button { 
                background: linear-gradient(135deg, #c9a03d, #8b6914); 
                border: none; 
                color: white; 
                padding: 4px 12px; 
                border-radius: 40px; 
                cursor: pointer; 
                font-size: 11px; 
                font-weight: 700;
                white-space: nowrap;
                transition: transform 0.2s ease;
            }
            
            .search-box button:active {
                transform: scale(0.95);
            }
            
            .my-location-btn { 
                background: rgba(0,0,0,0.85); 
                backdrop-filter: blur(20px); 
                border: 1px solid rgba(255,215,0,0.3);
                width: 40px;
                min-width: 40px;
                height: 40px;
                border-radius: 50%; 
                cursor: pointer; 
                font-size: 16px; 
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                transition: all 0.3s ease;
            }
            
            .my-location-btn:active {
                transform: scale(0.92);
            }
            
            /* Fix: Pickup mode row ko aur neeche karo */
            .pickup-mode-row {
                position: absolute;
                top: 108px;
                left: 8px;
                right: 8px;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            
            .row-buttons {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                align-items: center;
            }
            
            .pickup-mode-selector {
                display: flex;
                gap: 6px;
                flex: 1;
                flex-wrap: wrap;
            }
            
            .mode-btn {
                background: rgba(0,0,0,0.85);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255,215,0,0.3);
                color: white;
                padding: 8px 12px;
                border-radius: 40px;
                font-size: 11px;

            .mode-btn:active {

            .mode-btn.active {
                background: linear-gradient(135deg, #c9a03d, #8b6914);
                border-color: rgba(255,215,0,0.8);
            }
            
            .clear-location-btn {
                background: rgba(0,0,0,0.85);
                backdrop-filter: blur(16px);
                border: 1px solid rgba(255,215,0,0.2);
                color: white;
                padding: 8px 10px;
                border-radius: 40px;
                font-size: 10px;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 4px;
                flex-shrink: 0;
                white-space: nowrap;
                min-height: 38px;
                min-width: 38px;
                touch-action: manipulation;
                transition: all 0.3s ease;
            }
            
            .clear-location-btn:active {
                transform: scale(0.95);
            }
            
            .logout-btn-app {
                background: rgba(0,0,0,0.85);
                backdrop-filter: blur(16px);
                border: 1px solid rgba(255,215,0,0.2);
                color: white;
                padding: 8px 10px;
                border-radius: 40px;
                font-size: 10px;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;

                flex-shrink: 0;
                white-space: nowrap;
                min-height: 38px;
                min-width: 38px;
                touch-action: manipulation;
                transition: all 0.3s ease;
            }
            
            .logout-btn-app:active {
                transform: scale(0.95);
            }
            
            /* Fix: Instruction toast position */
            .instruction-toast {
                position: absolute;
                top: 152px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.85);
                backdrop-filter: blur(20px);
                color: #c9a03d;
                padding: 4px 12px;
                border-radius: 40px;
                font-size: 10px;
                font-weight: 600;
                z-index: 1000;
                border: 1px solid rgba(255,215,0,0.3);
                pointer-events: none;
                white-space: nowrap;
                transition: opacity 0.5s;
            }
            
            /* Fix: Search results - z-index and position */
            .search-results { 
                position: absolute; 
                top: 155px; 
                left: 8px; 
                right: 8px; 
                background: rgba(0,0,0,0.95); 
                backdrop-filter: blur(20px);
                border-radius: 16px; 
                border: 1px solid rgba(255,215,0,0.2); 
                z-index: 2000;

    <script>
        // --- App JS ---
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);

        setTimeout(() => {
            let toast = document.getElementById('instructionToast');

                    attribution: '&copy; OpenStreetMap & CartoDB',
                    subdomains: 'abcd',

                }).addTo(map);
            }
        }, 5000);
        
        let userMarker = null, accuracyCircle = null, currentRoute = null;
        let currentLat = null, currentLng = null;
        let currentVehicle = "sedan";
        let currentDestLat = null, currentDestLng = null;
        let currentRole = "customer";
        let isDriverOnline = false;
        let driverEarnings = 0;
        let safetyMarkers = [];
        let dropMarker = null;
        let pickupMarker = null;
        
        let pickupMode = 'myLocation';
        let chooseLocationStep = 'pickup';
        let dropSetBySearch = false;
        
        let currentStream = null;
        let customerPhoto = null;
        let driverPhoto = null;
        
        let rideRequests = JSON.parse(localStorage.getItem('rideRequests')) || [];
        let currentDistanceKm = 0;
        let locationUpdateTimer = null;
        
        // ========== GROUP 4 FIX: Save driver online state ==========
        let savedDriverState = localStorage.getItem('driverOnlineState');
        if(savedDriverState === 'true') {
            isDriverOnline = true;
        }
        
        // ========== DYNAMIC PRICING SYSTEM ==========
        let savedCycleTime = localStorage.getItem('pricingCycleStartTime');
        let pricingCycleStartTime = savedCycleTime ? parseInt(savedCycleTime) : Date.now();
        let dynamicSurcharge = 0;
        let pricingInterval = null;
        
        // ========== LOADING FUNCTIONS ==========
        function showLoading(message = 'Loading...') {
            const overlay = document.getElementById('loadingOverlay');
            const text = document.getElementById('loadingText');
            if(text) text.textContent = message;
            if(overlay) {
                overlay.style.display = 'flex';
                setTimeout(() => { overlay.classList.add('active'); }, 10);
            }
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if(overlay) {
                overlay.classList.remove('active');
                setTimeout(() => { overlay.style.display = 'none'; }, 300);
            }
        }
        
        function getSundayExtra() {
            let today = new Date();
            return today.getDay() === 0 ? 10 : 0;
        }
        
        function updateDynamicPricing() {
            let now = Date.now();
            let elapsedSeconds = Math.floor((now - pricingCycleStartTime) / 1000);
            
            let rawSurcharge = 0;
            if(elapsedSeconds < 300) {
                rawSurcharge = 5;
            } 
            else if(elapsedSeconds < 480) {
                rawSurcharge = 5;
            }
            else if(elapsedSeconds < 600) {
                rawSurcharge = 0;
            }
            else if(elapsedSeconds < 720) {
                rawSurcharge = 2;
            }
            else if(elapsedSeconds < 1020) {
                rawSurcharge = 0;
            }
            else {
                pricingCycleStartTime = now;
                localStorage.setItem('pricingCycleStartTime', pricingCycleStartTime.toString());
                rawSurcharge = 0;
            }
            
            dynamicSurcharge = Math.max(0, rawSurcharge);
            
            if(currentDistanceKm > 0) {
                updateAllVehicleTimes(currentDistanceKm);
                updateModalPrices();
                updateRouteInfoDisplay();
            } else {
                let vehicles = ['bike', 'auto', 'mini', 'hatchback', 'sedan', 'suv', 'luxury', 'ev', 'women_bike', 'women_auto', 'women_car'];
                vehicles.forEach(v => {
                    let fareSpan = document.getElementById(v + '_fare');
                    if(fareSpan) fareSpan.innerHTML = '₹--';
                });
                ['modalBikePrice', 'modalAutoPrice', 'modalMiniPrice', 'modalHatchbackPrice', 'modalSedanPrice', 'modalSuvPrice', 'modalLuxuryPrice', 'modalEvPrice', 'modalWomenBikePrice', 'modalWomenAutoPrice', 'modalWomenCarPrice'].forEach(id => {
                    if(document.getElementById(id)) document.getElementById(id).innerHTML = '₹--';
                });
            }
        }
        
        function getDynamicSurcharge() {
            return dynamicSurcharge;
        }
        
        function startPricingCycle() {
            updateDynamicPricing();
            if(pricingInterval) {
                clearInterval(pricingInterval);
                pricingInterval = null;
            }
            pricingInterval = setInterval(updateDynamicPricing, 10000);
        }
        
        const fareRates = { bike: 7, auto: 11, mini: 12, hatchback: 15, sedan: 18, suv: 22, luxury: 35, ev: 11, women_bike: 9, women_auto: 13, women_car: 18 };
        const vehicleEmoji = { bike: "🏍️", auto: "🛺", mini: "🚗", hatchback: "🚙", sedan: "🚘", suv: "🚙", luxury: "🚗✨", ev: "🔋🚗", women_bike: "👩‍🦰🏍️", women_auto: "👩‍🦰🛺", women_car: "👩‍🦰🚗" };
        
        function getNightCharge(vehicle) {
            const now = new Date();
            const hours = now.getHours();
            if (hours >= 22 || hours < 6) {
                let baseNightCharge = 29;
                if (vehicle === 'auto') {
                    return baseNightCharge + 14;
                } else if (vehicle === 'mini') {
                    return baseNightCharge + 20;
                } else if (vehicle === 'bike' || vehicle === 'women_bike') {
                    return baseNightCharge - 10;
                }
                return baseNightCharge;
            }
            return 0;
        }
        
        function calculateFinalFare(distanceKm, vehicle) {
            if(!vehicle || !fareRates[vehicle]) {
                console.warn('Unknown vehicle:', vehicle);
                return 50;
            }
            
            if(distanceKm <= 0 || !distanceKm) {
                return null;
            }
            
            let baseFare = Math.round(distanceKm * fareRates[vehicle]);
            let nightCharge = Math.max(0, getNightCharge(vehicle) || 0);
            let sundayExtra = Math.max(0, getSundayExtra() || 0);
            let dynamicExtra = Math.max(0, getDynamicSurcharge() || 0);
            let totalFare = baseFare + nightCharge + sundayExtra + dynamicExtra;
            
            let minFares = {
                bike: 25,
                auto: 30,
                mini: 35,
                hatchback: 40,
                sedan: 45,
                suv: 50,
                luxury: 70,
                ev: 35,
                women_bike: 30,
                women_auto: 35,
                women_car: 45
            };
            
            let minFare = minFares[vehicle] || 30;
            return Math.max(totalFare, minFare);
        }
        
        function updateModalPrices() {
            if(currentDistanceKm > 0) {
                let nightChargeBike = getNightCharge('bike');
                let nightChargeAuto = getNightCharge('auto');
                let nightChargeMini = getNightCharge('mini');
                let nightChargeOthers = getNightCharge('sedan');
                let sundayExtra = getSundayExtra();
                let dynamicExtra = getDynamicSurcharge();
                
                document.getElementById('modalBikePrice').innerHTML = '₹' + (Math.round(currentDistanceKm * fareRates.bike) + nightChargeBike + sundayExtra + dynamicExtra);
                document.getElementById('modalAutoPrice').innerHTML = '₹' + (Math.round(currentDistanceKm * fareRates.auto) + nightChargeAuto + sundayExtra + dynamicExtra);
                document.getElementById('modalMiniPrice').innerHTML = '₹' + (Math.round(currentDistanceKm * fareRates.mini) + nightChargeMini + sundayExtra + dynamicExtra);
                document.getElementById('modalHatchbackPrice').innerHTML = '₹' + (Math.round(currentDistanceKm * fareRates.hatchback) + nightChargeOthers + sundayExtra + dynamicExtra);
                document.getElementById('modalSedanPrice').innerHTML = '₹' + (Math.round(currentDistanceKm * fareRates.sedan) + nightChargeOthers + sundayExtra + dynamicExtra);
                document.getElementById('modalSuvPrice').innerHTML = '₹' + (Math.round(currentDistanceKm * fareRates.suv) + nightChargeOthers + sundayExtra + dynamicExtra);
                document.getElementById('modalLuxuryPrice').innerHTML = '₹' + (Math.round(currentDistanceKm * fareRates.luxury) + nightChargeOthers + sundayExtra + dynamicExtra);
                document.getElementById('modalEvPrice').innerHTML = '₹' + (Math.round(currentDistanceKm * fareRates.ev) + nightChargeOthers + sundayExtra + dynamicExtra);
                document.getElementById('modalWomenBikePrice').innerHTML = '₹' + (Math.round(currentDistanceKm * fareRates.women_bike) + nightChargeBike + sundayExtra + dynamicExtra);
                document.getElementById('modalWomenAutoPrice').innerHTML = '₹' + (Math.round(currentDistanceKm * fareRates.women_auto) + nightChargeAuto + sundayExtra + dynamicExtra);
                document.getElementById('modalWomenCarPrice').innerHTML = '₹' + (Math.round(currentDistanceKm * fareRates.women_car) + nightChargeOthers + sundayExtra + dynamicExtra);
            } else {
                ['modalBikePrice', 'modalAutoPrice', 'modalMiniPrice', 'modalHatchbackPrice', 'modalSedanPrice', 'modalSuvPrice', 'modalLuxuryPrice', 'modalEvPrice', 'modalWomenBikePrice', 'modalWomenAutoPrice', 'modalWomenCarPrice'].forEach(id => {
                    if(document.getElementById(id)) document.getElementById(id).innerHTML = '₹--';
                });
            }
        }
        
        function updateVerticalVehicleTimes() {
            if(currentDistanceKm > 0) {
                let isHighway = currentDistanceKm > 30;
                let vehicles = ['bike', 'auto', 'mini', 'hatchback', 'sedan', 'suv', 'luxury', 'ev', 'women_bike', 'women_auto', 'women_car'];
                vehicles.forEach(v => {
                    let tripMins = calculateTimeMinutes(currentDistanceKm, v, isHighway);
                    let fare = calculateFinalFare(currentDistanceKm, v);
                    let timeSpan = document.getElementById(v + '_time');
                    let fareSpan = document.getElementById(v + '_fare');
                    if(timeSpan) timeSpan.innerHTML = '🕐 ' + formatTime(tripMins);
                    if(fareSpan) fareSpan.innerHTML = fare ? '₹' + fare : '₹--';
                });
            } else {
                let vehicles = ['bike', 'auto', 'mini', 'hatchback', 'sedan', 'suv', 'luxury', 'ev', 'women_bike', 'women_auto', 'women_car'];
                vehicles.forEach(v => {
                    let fareSpan = document.getElementById(v + '_fare');
                    if(fareSpan) fareSpan.innerHTML = '₹--';
                    let timeSpan = document.getElementById(v + '_time');
                    if(timeSpan) timeSpan.innerHTML = '🕐 --';
                });
            }
        }
        
        function updateRouteInfoDisplay() {
            if(currentDistanceKm > 0 && currentLat && currentDestLat) {
                let isHighway = currentDistanceKm > 30;
                let tripMins = calculateTimeMinutes(currentDistanceKm, currentVehicle, isHighway);
                let fare = calculateFinalFare(currentDistanceKm, currentVehicle);
                let pickupMins = calculatePickupTime(currentVehicle);
                let routeType = isHighway ? "🛣️ Highway" : "🏙️ City";
                let womenText = (currentVehicle === 'women_bike' || currentVehicle === 'women_auto' || currentVehicle === 'women_car') ? " 👩‍🦰 Women Only" : "";
                let pickupModeText = pickupMode === 'myLocation' ? '📍 My Location' : '🗺️ Chosen Location';
                let nightCharge = getNightCharge(currentVehicle);
                let nightText = '';
                if (nightCharge > 0) {
                    if (currentVehicle === 'auto') {
                        nightText = ' 🌙 Night +₹43';
                    } else if (currentVehicle === 'mini') {
                        nightText = ' 🌙 Night +₹49';
                    } else if (currentVehicle === 'bike' || currentVehicle === 'women_bike') {
                        nightText = ' 🌙 Night +₹19';
                    } else {
                        nightText = ' 🌙 Night +₹29';
                    }
                }
                let sundayText = getSundayExtra() > 0 ? ' 🌟 Sunday +₹10' : '';
                
                let comparison = '<span style="font-size:8px;display:block;margin-top:3px;opacity:0.8;">' + routeType + ' | ' + currentDistanceKm.toFixed(1) + ' km<br>⏱️ Pickup: ' + formatTime(pickupMins) + ' | 🛣️ Trip: ' + formatTime(tripMins) + '<br>💰 ₹' + fare + womenText + nightText + sundayText + '<br>📌 ' + pickupModeText + '</span>';
                
                // Desktop
                let desktopRoute = document.getElementById('routeInfo');
                let desktopFare = document.getElementById('fareInfo');
                if(desktopRoute) desktopRoute.innerHTML = vehicleEmoji[currentVehicle] + ' ' + currentVehicle.toUpperCase() + ' • ' + formatTime(tripMins) + ' • ₹' + fare + comparison;
                if(desktopFare) desktopFare.innerHTML = '₹' + fare;
                
                // Mobile
                let mobileRoute = document.getElementById('routeInfoMobile');
                let mobileFare = document.getElementById('fareInfoMobile');
                let mobileDetail = document.getElementById('routeDetailMobile');
                
                if(mobileRoute) {
                    mobileRoute.innerHTML = vehicleEmoji[currentVehicle] + ' ' + currentVehicle.toUpperCase() + ' • ' + formatTime(tripMins) + ' • ₹' + fare;
                }
                if(mobileFare) mobileFare.innerHTML = '₹' + fare;
                if(mobileDetail) {
                    mobileDetail.style.display = 'block';
                    mobileDetail.innerHTML = routeType + ' | ' + currentDistanceKm.toFixed(1) + ' km • Pickup: ' + formatTime(pickupMins) + womenText + nightText + sundayText + ' • ' + pickupModeText;
                }

                updateBookingBar(currentVehicle, fare, tripMins);
                
            } else {
                let desktopRoute = document.getElementById('routeInfo');
                let desktopFare = document.getElementById('fareInfo');

                let mobileFare = document.getElementById('fareInfoMobile');
                let mobileDetail = document.getElementById('routeDetailMobile');
                if(mobileRoute) mobileRoute.innerHTML = '✨ Search any place ✨';
                if(mobileFare) mobileFare.innerHTML = 'Select';
                if(mobileDetail) {
                    mobileDetail.style.display = 'none';
                    mobileDetail.innerHTML = '';

                document.getElementById('bookingBar').style.display = 'none';
            }

        function calculatePickupTime(vehicle) {
            let baseTimes = { bike: 2, auto: 3, mini: 4, hatchback: 4, sedan: 5, suv: 6, luxury: 7, ev: 5, women_bike: 4, women_auto: 5, women_car: 6 };
            let base = baseTimes[vehicle] || 5;
            let variation = Math.floor(Math.random() * 3);
            return base + variation;
        }
        
        function formatTime(minutes) {
            if(minutes <= 0) return "Now";
            if(minutes === 1) return "1m";
            if(minutes >= 60) {
                let hrs = Math.floor(minutes / 60);
                let mins = minutes % 60;
                if(mins === 0) return hrs + "h";
                return hrs + "h " + mins + "m";
            }
            return minutes + "m";
        }
        
        function calculateTimeMinutes(distanceKm, vehicle, isHighway) {
            let minutes = 0;
            if(isHighway) {
                let speeds = { bike:62, auto:42, mini:75, hatchback:80, sedan:85, suv:82, luxury:95, ev:78, women_bike:58, women_auto:40, women_car:80 };
                minutes = Math.round((distanceKm / (speeds[vehicle] || 78)) * 60);
            } else {
                let speeds = { bike:27, auto:13, mini:18, hatchback:19, sedan:20, suv:18, luxury:22, ev:21, women_bike:24, women_auto:12, women_car:19 };
                minutes = Math.round((distanceKm / (speeds[vehicle] || 20)) * 60);
            }
            let hour = new Date().getHours();
            let isPeakHour = (hour >= 9 && hour <= 11) || (hour >= 17 && hour <= 20);
            if(isPeakHour && !isHighway) minutes = Math.round(minutes * 1.25);
            if(!isHighway && distanceKm > 2) minutes = Math.round(minutes + Math.floor(distanceKm / 2));
            return Math.max(minutes, 2);
        }

        // ========== BOOKING BAR FUNCTION ==========
        function updateBookingBar(vehicle, fare, tripMins) {
            const bar = document.getElementById('bookingBar');

        function updateLocation(position) {
            if(pickupMode === 'myLocation') {
                currentLat = position.coords.latitude;
                currentLng = position.coords.longitude;
                const sp = position.coords && position.coords.speed;
                const speedText = (typeof sp === 'number' && !isNaN(sp)) ? Math.round(sp * 3.6) + ' km/h' : '0 km/h';
                
                const speedEl = document.getElementById('speedInfo');
                const speedElMobile = document.getElementById('speedInfoMobile');
                if (speedEl) speedEl.textContent = speedText;
                if (speedElMobile) speedElMobile.textContent = speedText;
                
                if(accuracyCircle) map.removeLayer(accuracyCircle);
                accuracyCircle = L.circle([currentLat, currentLng], {
                    radius: position.coords.accuracy,
                    color: '#007bff',
                    fillColor: '#007bff',
                    fillOpacity: 0.08,
                    weight: 1
                }).addTo(map);
                if(!userMarker) {
                    userMarker = L.marker([currentLat, currentLng], {
                        icon: L.divIcon({ 
                            html: '<div style="width:16px;height:16px;background:#007bff;border:3px solid white;border-radius:50%;box-shadow:0 0 8px rgba(0,123,255,0.5);"></div>', 
                            iconSize: [16, 16] 
                        })
                    }).addTo(map);
                    map.setView([currentLat, currentLng], 14);
                } else {
                    userMarker.setLatLng([currentLat, currentLng]);
                }
                if(currentDestLat && currentDestLng) drawRoute();
            }
        }

        // ========== GROUP 1 FIX: drawRoute with loading ==========
        function drawRoute() {
            if(!currentLat || !currentDestLat) return;
            if(currentRoute) map.removeControl(currentRoute);
            
            showLoading('Finding best route...');
            
            currentRoute = L.Routing.control({
                waypoints: [L.latLng(currentLat, currentLng), L.latLng(currentDestLat, currentDestLng)],
                routeWhileDragging: false,
                showAlternatives: false,
                lineOptions: { styles: [{ color: '#007bff', weight: 5, opacity: 0.8 }] },
                router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
                addWaypoints: false, draggableWaypoints: false, show: false
            }).addTo(map);
            currentRoute.on('routesfound', function(e) {
                hideLoading();
                let distance = (e.routes[0].summary.totalDistance / 1000);
                currentDistanceKm = distance;
                let isHighway = distance > 30;
                updateAllVehicleTimes(distance);
                updateRouteInfoDisplay();
                updateModalPrices();
                map.fitBounds(L.latLngBounds([currentLat, currentLng], [currentDestLat, currentDestLng]), { padding: [40, 40] });
                document.getElementById('bookingBar').style.display = 'block';
            });
            
            currentRoute.on('routingerror', function(e) {
                hideLoading();
                console.log('Routing failed:', e);
                let distance = getDistance(currentLat, currentLng, currentDestLat, currentDestLng);
                currentDistanceKm = distance;
                updateAllVehicleTimes(distance);
                updateRouteInfoDisplay();
                updateModalPrices();
                document.getElementById('bookingBar').style.display = 'block';
            });
        }
        
        function getDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            let dLat = (lat2 - lat1) * Math.PI / 180, dLng = (lng2 - lng1) * Math.PI / 180;
            let a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
        
        let searchTimeout;
        async function performSearch(searchInputElement, resultsElement) {
            let query = searchInputElement.value.trim();
            if(!query || !currentLat) return;
            resultsElement.style.display = 'block';
            
            showLoading('Searching...');
            
            try {
                let url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query) + '&limit=25&addressdetails=1&dedupe=1';
                let res = await fetch(url);
                let data = await res.json();
                hideLoading();
                
                resultsElement.innerHTML = '';
                if(data.length === 0) {
                    resultsElement.innerHTML = '<div style="padding:16px;text-align:center;color:rgba(255,255,255,0.6);">✨ No results found ✨</div>';
                    return;
                }
                let resultsWithDistance = data.map(item => {
                    let dist = getDistance(currentLat, currentLng, parseFloat(item.lat), parseFloat(item.lon));
                    return { ...item, distance: dist };
                });
                resultsWithDistance.sort((a, b) => a.distance - b.distance);
                resultsWithDistance.slice(0, 20).forEach(item => {
                    let lat = parseFloat(item.lat), lng = parseFloat(item.lon);
                    let distance = item.distance;
                    let distanceText = distance < 1 ? Math.round(distance * 1000) + 'm' : distance.toFixed(1) + 'km';
                    let icon = '📍';
                    let displayName = item.display_name.toLowerCase();
                    let name = item.display_name.split(',')[0];
                    if(displayName.includes('temple') || displayName.includes('mandir')) icon = '🛕';
                    else if(displayName.includes('gurudwara')) icon = '🛐';
                    else if(displayName.includes('mosque')) icon = '🕌';
                    else if(displayName.includes('church')) icon = '⛪';
                    else if(displayName.includes('railway') || displayName.includes('station')) icon = '🚉';
                    let div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = '<div style="flex:1"><div class="result-name">' + icon + ' ' + (name.length > 30 ? name.substring(0, 28) + '...' : name) + '</div><div class="result-address">' + item.display_name.substring(0, 55) + '</div></div><div class="result-distance">' + distanceText + '</div>';
                    
                    // ========== FIX: Search result click - FORCE CLOSE ==========
                    div.onclick = function() {
                        // Close results IMMEDIATELY
                        resultsElement.style.display = 'none';
                        resultsElement.innerHTML = '';
                        
                        // Close mobile results too
                        const mobileResults = document.getElementById('searchResultsMobile');
                        if(mobileResults) {
                            mobileResults.style.display = 'none';
                            mobileResults.innerHTML = '';
                        }
                        
                        if(pickupMode === 'chooseLocation') {
                            if(chooseLocationStep === 'pickup') {
                                confirmSetLocation('pickup', lat, lng, name, icon);
                                let searchInputDesktop = document.getElementById('searchInput');
                                let searchInputMobile = document.getElementById('searchInputMobile');
                                if(searchInputDesktop) searchInputDesktop.value = name;
                                if(searchInputMobile) searchInputMobile.value = name;
                            } else {
                                confirmSetLocation('drop', lat, lng, name, icon);
                                let searchInputDesktop = document.getElementById('searchInput');
                                let searchInputMobile = document.getElementById('searchInputMobile');
                                if(searchInputDesktop) searchInputDesktop.value = name;
                                if(searchInputMobile) searchInputMobile.value = name;
                                document.getElementById('bookingBar').style.display = 'block';
                            }
                        } else {
                            if(dropMarker) map.removeLayer(dropMarker);
                            dropMarker = L.marker([lat, lng], { 
                                icon: L.divIcon({ 
                                    html: '<div style="font-size: 24px;">' + icon + '</div>', 
                                    iconSize: [24, 24] 
                                }) 
                            }).addTo(map);
                            dropMarker.bindPopup('<b>' + icon + ' ' + name + '</b>').openPopup();
                            currentDestLat = lat; 
                            currentDestLng = lng; 
                            dropSetBySearch = true;
                            
                            showLoading('Finding route...');
                            drawRoute();
                            map.flyTo([lat, lng], 14);
                            
                            let searchInputDesktop = document.getElementById('searchInput');
                            let searchInputMobile = document.getElementById('searchInputMobile');
                            if(searchInputDesktop) searchInputDesktop.value = name;
                            if(searchInputMobile) searchInputMobile.value = name;
                            document.getElementById('bookingBar').style.display = 'block';
                        }
                        
                        // Extra: Close on map click
                        setTimeout(() => {
                            if(searchResultsDesktop) searchResultsDesktop.style.display = 'none';
                            if(searchResultsMobile) searchResultsMobile.style.display = 'none';
                        }, 100);
                    };
                    resultsElement.appendChild(div);
                });
            } catch(e) {
                hideLoading();
                resultsElement.innerHTML = '<div style="padding:16px;text-align:center;color:#ff6b6b;">❌ Search failed. Please try again.</div>';
            }
        }

        function loadDriverRides() {
            if(!isDriverOnline) return;
            let pending = rideRequests.filter(r => r.status === 'pending');
            let container = document.getElementById('rideRequestsList');
            if(pending.length === 0) { container.innerHTML = '<p style="text-align:center; opacity:0.7;">✨ No ride requests ✨</p>'; return; }
            container.innerHTML = '';
            pending.forEach(ride => {
                let div = document.createElement('div');
                div.className = 'ride-request';
                div.innerHTML = '<div>📍 ' + ride.destName.substring(0, 30) + '</div><div style="font-size:10px;">' + (ride.distance || 0).toFixed(1) + ' km | ' + ride.vehicle + '</div><button class="accept-btn" onclick="verifyAndAccept(' + ride.id + ')">✅ Accept Ride</button>';
                container.appendChild(div);
            });
        }
        
        window.verifyAndAccept = function(rideId) {
            let ride = rideRequests.find(r => r.id === rideId);
            if(ride) {
                ride.status = 'accepted';
                localStorage.setItem('rideRequests', JSON.stringify(rideRequests));
                let fare = calculateFinalFare(ride.distance, ride.vehicle);
                alert('✅ Request accepted!\\n📏 ' + ride.distance.toFixed(1) + ' km\\n💰 Fare: ₹' + fare);
                currentDestLat = ride.customerLat;
                currentDestLng = ride.customerLng;
                drawRoute();
                loadDriverRides();
            }
        };
        
        async function openCamera(forType, callback) {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                let videoElement = forType === 'customer' ? document.getElementById('video') : document.getElementById('driverVideo');
                videoElement.srcObject = stream;
                currentStream = stream;
                if(forType === 'customer') {
                    document.getElementById('cameraModal').classList.add('active');
                    window.cameraCallback = callback;
                } else {
                    document.getElementById('driverCameraModal').classList.add('active');
                    window.driverCameraCallback = callback;
                }
            } catch(err) { alert("Camera access denied."); }
        }
        
        function closeCamera() {
            if(currentStream) { currentStream.getTracks().forEach(track => track.stop()); currentStream = null; }
            document.getElementById('cameraModal').classList.remove('active');
        }
        
        function closeDriverCamera() {
            if(currentStream) { currentStream.getTracks().forEach(track => track.stop()); currentStream = null; }
            document.getElementById('driverCameraModal').classList.remove('active');
        }
        
        async function capturePhoto(type) {
            let videoElement = type === 'customer' ? document.getElementById('video') : document.getElementById('driverVideo');
            let canvas = document.createElement('canvas');
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            let imageData = canvas.toDataURL('image/jpeg', 0.8);
            if(type === 'customer') {
                customerPhoto = imageData;
                closeCamera();
                if(window.cameraCallback) window.cameraCallback();
            } else {
                driverPhoto = imageData;
                closeDriverCamera();
                if(window.driverCameraCallback) window.driverCameraCallback();
            }
        }
        
        // ========== GROUP 4 FIX: requestRide with proper error handling ==========
        function requestRide() {
            if(!currentDestLat || !currentDestLng) {
                alert('❌ Please set a destination first!\n\nTap on map or search for a place.');
                return;
            }
            
            if(!currentLat || !currentLng) {
                alert('❌ Your location not available!\n\nPlease allow location access or select pickup location.');
                return;
            }
            
            let fare = calculateFinalFare(currentDistanceKm, currentVehicle);
            if(!fare || fare <= 0) {
                alert('❌ Cannot calculate fare. Please try again.');
                return;
            }
            
            let ride = {
                id: Date.now(),
                customerLat: currentLat,
                customerLng: currentLng,
                destLat: currentDestLat,
                destLng: currentDestLng,
                destName: document.getElementById('searchInput')?.value || document.getElementById('searchInputMobile')?.value || 'Destination',
                vehicle: currentVehicle,
                distance: currentDistanceKm,
                status: 'pending',
                timestamp: new Date().toISOString()
            };
            
            rideRequests.push(ride);
            localStorage.setItem('rideRequests', JSON.stringify(rideRequests));
            
            alert('🚖 Ride Requested Successfully!\n\n' +
                  '📍 Pickup: Your Location\n' +
                  '🏁 Drop: ' + ride.destName + '\n' +
                  '📏 Distance: ' + currentDistanceKm.toFixed(1) + ' km\n' +
                  '🚗 Vehicle: ' + currentVehicle.toUpperCase() + '\n' +
                  '💰 Fare: ₹' + fare + '\n\n' +
                  '⏳ Finding nearby partner...');
                  
            showLoading('Finding nearby partner...');
            setTimeout(() => {
                hideLoading();
                alert('✅ Partner found! They are on their way.\n\n' +
                      '📱 Check your notifications for updates.');
            }, 2000);
        }

        window.findNearest = async function(type) {

                alert('❌ Your location not available!');
                return;
            }
            
            showLoading('Finding nearest ' + (type === 'police' ? 'Police Station' : 'Hospital') + '...');

            safetyMarkers = [];
            let searchQuery = type === 'police' ? 'police station' : 'hospital';
            let url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + searchQuery + '&lat=' + currentLat + '&lon=' + currentLng + '&radius=10000&limit=5';
            try {
                let res = await fetch(url);
                let data = await res.json();
                hideLoading();
                if(data.length === 0) {
                    alert('❌ No ' + (type === 'police' ? 'police stations' : 'hospitals') + ' found nearby.');
                    return;
                }
                data.forEach(item => {
                    let lat = parseFloat(item.lat), lng = parseFloat(item.lon);
                    let distance = getDistance(currentLat, currentLng, lat, lng);
                    let icon = L.divIcon({ html: '<div style="font-size: 24px;">' + (type === 'police' ? '🚓' : '🏥') + '</div>', iconSize: [24, 24] });
                    let marker = L.marker([lat, lng], { icon: icon }).addTo(map);
                    marker.bindPopup('<b>' + (type === 'police' ? '🚓 Police Station' : '🏥 Hospital') + '</b><br>' + item.display_name.substring(0, 40) + '<br>📏 ' + distance.toFixed(1) + ' km away');
                    safetyMarkers.push(marker);
                });
                alert('✅ Found ' + safetyMarkers.length + ' ' + (type === 'police' ? 'police stations' : 'hospitals') + ' nearby!\n📍 Marked on map.');
                if(safetyMarkers.length > 0) {
                    map.fitBounds(L.latLngBounds(safetyMarkers.map(m => m.getLatLng())), { padding: [50, 50] });
                }
            } catch(e) {
                hideLoading();
                alert('❌ Error finding nearby ' + (type === 'police' ? 'police stations' : 'hospitals') + '. Please try again.');
            }
        };

        // ========== MAC LOCATION FIX ==========
        function initLocationWithFallback() {
            if (!navigator.geolocation) {
                document.getElementById('speedInfo').innerHTML = "⚠️ Location not supported";
                document.getElementById('speedInfoMobile').innerHTML = "⚠️ Location not supported";
                return;
            }
            
            const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
            const options = {
                enableHighAccuracy: true,
                timeout: isMac ? 30000 : 10000,
                maximumAge: 0
            };
            
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    updateLocation(pos);
                    if (navigator.geolocation.watchPosition) {
                        navigator.geolocation.watchPosition(
                            throttledUpdateLocation,
                            function(err) { console.warn('Watch position error:', err); },
                            options
                        );
                    }
                },
                function(err) {
                    console.warn('Location error:', err);
                    if (isMac && err.code === 1) {
                        document.getElementById('speedInfo').innerHTML = "⚠️ Allow location";
                        document.getElementById('speedInfoMobile').innerHTML = "⚠️ Allow location";
                        showLocationHelp();
                    } else if (err.code === 3) {
                        navigator.geolocation.getCurrentPosition(
                            function(pos) { updateLocation(pos); },
                            function(err2) { handleLocationError(err2); },
                            { enableHighAccuracy: false, timeout: 15000 }
                        );
                    } else {
                        handleLocationError(err);
                    }
                },
                options
            );
        }
        
        function showLocationHelp() {
            let helpMsg = document.createElement('div');
            helpMsg.style.cssText = `
                position: fixed;
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.95);
                color: #ffdd88;
                padding: 15px 25px;
                border-radius: 16px;
                z-index: 10001;
                font-size: 12px;
                max-width: 90%;
                text-align: center;
                border: 1px solid rgba(255,215,0,0.3);
                box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            `;
            helpMsg.innerHTML = `
                <b>📍 Location Access Required</b><br>
                <span style="font-size:11px;color:rgba(255,255,255,0.7);">
                Mac: System Settings → Privacy & Security → Location Services<br>
                Allow your browser (Chrome/Safari) access
                </span>
                <br><br>
                <button onclick="this.parentElement.remove()" style="
                    background: #c9a03d;
                    border: none;
                    color: white;
                    padding: 6px 20px;
                    border-radius: 30px;
                    cursor: pointer;
                    font-weight: 600;
                    font-size: 12px;
                ">Got it!</button>
            `;
            document.body.appendChild(helpMsg);
            setTimeout(() => { if (helpMsg.parentElement) helpMsg.remove(); }, 15000);
        }
        
        function handleLocationError(error) {
            let msg = '📍 Location unavailable';
            if (error && error.message) {
                msg = error.message;
            }
            document.getElementById('speedInfo').innerHTML = msg;
            document.getElementById('speedInfoMobile').innerHTML = msg;
            tryFallbackLocation();
        }
        
        async function tryFallbackLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (response.ok) {
                    const data = await response.json();
                    if (data.latitude && data.longitude) {
                        const fallbackPos = {
                            coords: {
                                latitude: data.latitude,
                                longitude: data.longitude,
                                speed: 0,
                                accuracy: 5000
                            }
                        };
                        updateLocation(fallbackPos);
                        document.getElementById('speedInfo').innerHTML = "📍 IP based";
                        document.getElementById('speedInfoMobile').innerHTML = "📍 IP based";
                    }
                }
            } catch(e) {
                const fallbackPos = {
                    coords: {
                        latitude: 28.6139,
                        longitude: 77.2090,
                        speed: 0,
                        accuracy: 10000
                    }
                };
                updateLocation(fallbackPos);
                document.getElementById('speedInfo').innerHTML = "📍 Default";
                document.getElementById('speedInfoMobile').innerHTML = "📍 Default";
            }
        }
        
        // Start location with Mac fix
        initLocationWithFallback();
        
        map.on('click', () => {
            if(searchResultsDesktop) searchResultsDesktop.style.display = 'none';
            if(searchResultsMobile) searchResultsMobile.style.display = 'none';

        }
        if(logoutBtnMobile) {
            logoutBtnMobile.addEventListener('click', handleLogout);
        }
